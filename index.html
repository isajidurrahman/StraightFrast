<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straightfrast - Premium Clothing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Straightfrast</div>
        <nav>
            <a href="#shop">Shop</a>
            <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
            <a href="#profile" id="nav-profile">Account</a>
        </nav>
    </header>

    <main>
        <section id="profile-section" class="card">
            <div id="auth-container">
                <h2>Login / Sign Up</h2>
                <input type="email" id="auth-email" placeholder="Email" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <button id="btn-login">Login</button>
                <button id="btn-signup" class="btn-secondary">Sign Up</button>
            </div>

            <div id="user-profile" class="hidden">
                <h2>Your Profile</h2>
                <div class="profile-header">
                    <img id="profile-pic-view" src="https://via.placeholder.com/150" alt="Profile Picture">
                    <input type="file" id="profile-pic-input" accept="image/*">
                </div>
                <div class="profile-details">
                    <input type="text" id="user-name" placeholder="Full Name">
                    <input type="text" id="user-phone" placeholder="Phone Number">
                    <textarea id="user-address" placeholder="Delivery Address"></textarea>
                    <button id="btn-save-profile">Save Profile Info</button>
                    <button id="btn-logout" class="btn-secondary">Logout</button>
                </div>
            </div>
        </section>

        <section id="shop">
            <h2>Our Collection</h2>
            <div id="product-grid" class="grid"></div>
        </section>

        <section id="cart" class="card">
            <h2>Your Cart</h2>
            <div id="cart-items"></div>
            <div class="cart-total">Total: $<span id="cart-total-price">0</span></div>
            
            <hr>
            
            <h3>Checkout & Delivery Details</h3>
            <form id="checkout-form">
                <input type="text" id="checkout-name" placeholder="Receiver's Name" required>
                <input type="email" id="checkout-email" placeholder="Email Address" required>
                <input type="text" id="checkout-phone" placeholder="Phone Number" required>
                <textarea id="checkout-address" placeholder="Shipping Address" required></textarea>
                <button type="submit" id="btn-place-order">Place Order</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Straightfrast. All Rights Reserved.</p>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
